<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kate - AI Chatbot</title>
    <link rel="stylesheet" href="/css/ai-chat.css?v=3.1">
</head>
<body>
    <!-- History Drawer -->
    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    
    <aside id="historyDrawer" class="history-drawer">
        <div class="drawer-header">
            <h2>Chat History</h2>
            <button id="closeDrawerBtn" class="close-drawer-btn" aria-label="Close history">&times;</button>
        </div>
        <div class="drawer-content">
            <button id="newChatBtn" class="btn-new-chat">+ New Chat</button>
            <div id="historyList" class="history-list">
                <!-- History items will be populated here -->
            </div>
        </div>
    </aside>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-left">
                <button id="menuBtn" class="menu-btn" aria-label="Open menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/>
                    </svg>
                </button>
                <h1>Kate - AI Chatbot</h1>
            </div>
            <div class="header-right">
                <a href="/templates/insights.html" class="btn-insights" aria-label="View insights">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
                    </svg>
                    <span>Insights Dashboard</span>
                </a>
                <button id="clearBtn" class="btn-clear-history" aria-label="Clear history">Clear History</button>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main>
            <div id="messages">
                <!-- Welcome Message -->
                <div class="welcome-message">
                    <h2>Hi! I'm Kate, your financial assistant 👋</h2>
                    <p>I can help you track expenses, manage your budget, set savings goals, and give you personalized financial advice.</p>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    id="userInput" 
                    placeholder="Type your message here... (Type 'help' for commands)" 
                    rows="1"
                    aria-label="Message input"
                ></textarea>
                <button id="sendBtn" aria-label="Send message">Send</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js?v=3.1"></script>
</body>
</html>
